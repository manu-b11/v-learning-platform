spring.application.name=learning-platform
server.port=8080
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------
# Base de datos: PostgreSQL. El esquema lo crea database/vlearning_postgresql.sql
# (Hibernate NO crea ni modifica tablas).
# Variables de entorno: DB_USER y DB_PASSWORD (obligatorias), DB_URL (opcional)
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vlearning}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-file-size=5MB

# Carpeta donde se guardan las portadas subidas por los instructores.
vlearning.uploads.dir=${VLEARNING_UPLOADS_DIR:uploads}

# ---------------------------------------------------------------
# V-Learning
# ---------------------------------------------------------------
# Dominio permitido para correos institucionales (RF-001)
vlearning.dominio-institucional=tdea.edu.co

# Modo desarrollo: devuelve OTP, contraseña temporal y enlace de recuperación
# en la respuesta de la API para probar sin correo. APAGAR en producción.
vlearning.dev.exponer-secretos=${VLEARNING_DEV_EXPONER_SECRETOS:true}
# Crea datos de demostración si no hay usuarios
vlearning.dev.sembrar-datos=${VLEARNING_DEV_SEMBRAR_DATOS:true}

# Correo saliente (opcional). Para activarlo define las variables de entorno
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD.
# Sin SMTP el sistema funciona: las notificaciones quedan en la plataforma.
vlearning.mail.remitente=${MAIL_REMITENTE:no-reply@tdea.edu.co}

# JWT_SECRET: obligatoria, mínimo 32 caracteres
vlearning.jwt.secret=${JWT_SECRET}
vlearning.jwt.expiracion-horas=8

# Sesión: inactividad deslizante (RF-002, RF-013)
vlearning.sesion.inactividad-minutos=30

# OTP (RF-002, RF-044: mínimo 10 minutos) y recuperación (RF-003)
vlearning.otp.minutos-validez=10
vlearning.recuperacion.minutos-validez=15
vlearning.recuperacion.url-base=http://localhost:5173/restablecer
# Desbloqueo por enlace al correo (RF-043): vence a los 15 minutos
vlearning.desbloqueo.url-base=${VLEARNING_DESBLOQUEO_URL:http://localhost:5173/desbloquear}

# Bloqueo: 5 fallos en 15 min bloquean 15 min (RF-002)
vlearning.bloqueo.intentos-maximos=5
vlearning.bloqueo.ventana-minutos=15
vlearning.bloqueo.bloqueo-minutos=15

# Chat (RF-010)
vlearning.chat.longitud-maxima=1000
vlearning.chat.palabras-prohibidas=idiota,estupido,imbecil,basura humana

# Notificaciones (RF-011): job diario
vlearning.notificaciones.dias-inactividad=3
vlearning.notificaciones.cron=0 0 8 * * *
# Días de anticipación para avisar fechas límite de evaluaciones y tareas (RF-011)
vlearning.notificaciones.dias-anticipacion-fecha-limite=2

# CORS: orígenes del frontend
vlearning.cors.origenes=http://localhost:5173,http://localhost:5176

# ---------------------------------------------------------------
# Tutor de IA con Ollama local (RF-024). Solo texto.
# ---------------------------------------------------------------
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:gemma2:2b}
ollama.timeout-segundos=120
ollama.num-predict=400
ollama.temperatura=0.3

# ---------------------------------------------------------------
# Texto a voz en el servidor (RF-036, RF-032). prueba = MP3 de silencio, sin dependencias;
# espeak = espeak-ng + ffmpeg instalados en el servidor (gratuitos y locales).
# ---------------------------------------------------------------
vlearning.tts.proveedor=${VLEARNING_TTS:prueba}
vlearning.tts.espeak-ruta=espeak-ng
vlearning.tts.ffmpeg-ruta=ffmpeg
vlearning.tts.voz=es-419

# Reconocimiento de voz para subtítulos (RF-037). prueba = borrador de ejemplo, sin dependencias;
# whisper = whisper.cpp + ffmpeg locales con un modelo descargado (gratuito, sin nube).
vlearning.transcripcion.proveedor=${VLEARNING_TRANSCRIPCION:prueba}
vlearning.transcripcion.ffmpeg-ruta=ffmpeg
vlearning.transcripcion.whisper-ruta=whisper-cli
vlearning.transcripcion.modelo=models/ggml-base.bin

# Braille electrónico (RF-032). basico = grado 1 incluido; liblouis = lou_translate instalado.
vlearning.braille.proveedor=${VLEARNING_BRAILLE:basico}
vlearning.braille.lou-ruta=lou_translate
vlearning.braille.tabla=es-g1.ctb

springdoc.swagger-ui.path=/swagger-ui.html
# Apaga la documentación interactiva en producción: VLEARNING_SWAGGER=false
springdoc.api-docs.enabled=${VLEARNING_SWAGGER:true}
springdoc.swagger-ui.enabled=${VLEARNING_SWAGGER:true}
